name: Test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components tools tests
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: find edge/st-local-edge/src -name '*.lua' -exec luac5.3 -p {} \;
      - run: lua5.3 tests/test_wire.lua
      - run: lua5.3 tests/test_transport.lua
