name: ST Universal checks
on:
  push:
    paths: ['universal/**','direct/**','.github/workflows/universal.yml']
  pull_request:
    paths: ['universal/**','direct/**','.github/workflows/universal.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: python -m unittest discover -s universal/tests -v
      - run: python -m unittest discover -s direct/tests -p test_build.py -v
      - run: ./universal/tests/test_deploy.ps1
        shell: pwsh
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 direct/tests/test_model.lua && lua5.3 direct/tests/test_runtime.lua
      - run: python universal/build.py --all-official --wonjj ef00-covers-2-wonjj6768 ef00-presence-general-2-wonjj6768 zcl-plugs-wonjj6768 zcl-sensors-wonjj6768 --out /tmp/st-universal
      - run: python universal/repair_profiles.py /tmp/st-universal --check
      - run: find /tmp/st-universal -name '*.lua' -not -path '*/test/*' -not -path '*/tests/*' -exec luac5.3 -p {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: st-universal-official-wonjj
          path: /tmp/st-universal
